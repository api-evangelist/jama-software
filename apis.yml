aid: jama-software

name: Jama Software

description: Jama Software is the maker of Jama Connect, a requirements management and live-traceability platform used by teams building complex
  products, systems, and software in regulated industries such as medical devices, automotive, aerospace and defense, semiconductor, and industrial.
  Jama Connect exposes a versioned REST API (v1) at https://{instance}.jamacloud.com/rest/v1/ covering items, projects, relationships, item types,
  baselines, test plans, test cycles, test runs, users, user groups, tags, attachments, and activities. The API supports HTTP Basic authentication
  and OAuth 2.0 client-credentials, ships official Python, Java, Node.js, and Ruby clients, and is documented through an interactive Swagger reference
  with a dated changelog and versioning policy.

